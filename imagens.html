<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imagens – BIXO</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin:0;
  height:100%;
  overflow-x:hidden;
}

body {
  font-family: Arial, sans-serif;
  display:flex;
  flex-direction:column;
}

/* container */
.conteudo {
  display:flex;
  flex-direction:column;
  height:100vh;
}

/* 🔥 FIX REAL DO MASONRY */
.mosaico {
  column-width: 250px;
  column-gap: 0;
  width:100%;
}

/* 🔥 ESSENCIAL */
.mosaico img {
  width:100%;
  display:block;
  break-inside: avoid;
  page-break-inside: avoid; /* compatibilidade */
  margin:0;
  padding:0;
}

/* 🔥 REMOVE GAP INVISÍVEL */
.mosaico::before {
  content:'';
  display:block;
}

/* botão */
.voltar {
  text-align:center;
  padding:10px;
  border-top:1px solid #ccc;
}

/* modal */
.modal {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.9);
  justify-content:center;
  align-items:center;
}

.modal img {
  max-width:90%;
  max-height:90%;
}
</style>
</head>

<body>

<div class="conteudo">
  <div class="mosaico" id="mosaico"></div>

  <div class="modal" id="modal">
    <img id="modalImg">
  </div>

  <div class="voltar">
    <a href="index.html">BIXO</a>
  </div>
</div>

<script>
const mosaico = document.getElementById('mosaico');
const modal = document.getElementById('modal');
const modalImg = document.getElementById('modalImg');

/* imagens */
const imagens = [];
for(let i=1;i<=102;i++){
  imagens.push(`img${i}.jpg`);
}

/* 🔥 FORÇA REFLUXO CORRETO DAS COLUNAS */
imagens.forEach(src=>{
  const img = new Image();
  img.src = src;

  img.onload = ()=>{
    img.style.width = "100%";
    img.style.display = "block";

    img.onclick = ()=>{
      modal.style.display='flex';
      modalImg.src = src;
    };

    mosaico.appendChild(img);
  };
});

/* fechar modal */
modal.onclick = ()=> modal.style.display='none';
</script>

</body>
</html>
