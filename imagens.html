<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imagens – BIXO</title>

<style>
  html, body { margin:0; height:100%; }

  body.imagens-page {
    font-family: Arial, sans-serif;
    background:#fff;
    display:flex;
    flex-direction:column;
    user-select:none;
  }

  /* Conteúdo principal */
  .conteudo {
    display:none;
    flex:1;
    flex-direction:column;
    overflow:hidden;
  }

  /* 🔥 MASONRY RESTAURADO */
.mosaico {
  column-width: 250px;
  column-gap: 0;
  width: 100%;
  flex: 1;
  overflow-y: auto;
}

.mosaico img {
  width: 100%;
  display: inline-block; /* 🔥 IMPORTANTE */
  break-inside: avoid;
}
    /* 🔥 remove micro espaços */
    margin-bottom: -2px;
  }

  .mosaico img:hover {
    transform: scale(1.03);
  }

  /* Botão voltar */
  .voltar {
    text-align:center;
    padding:12px 0;
    border-top:1px solid #e5e5e5;
    background:#fff;
  }

  .voltar a {
    all:unset;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    padding:8px 16px;
    display:inline-block;
    transition: transform 0.2s ease;
  }

  .voltar a:hover { transform: scale(1.05); }

  /* Modal */
  .modal {
    display:none;
    position:fixed; inset:0;
    background:rgba(0,0,0,0.85);
    justify-content:center;
    align-items:center;
    z-index:9998;
    cursor:zoom-out;
    overflow:hidden;
  }

  .modal img {
    max-width:90vw;
    max-height:90vh;
    object-fit:contain;
    border-radius:10px;
    pointer-events:none;
    user-select:none;
    transition: transform 0.5s ease;
    transform: scale(0);
  }

  .modal.show img { transform: scale(1); }

</style>
</head>

<body class="imagens-page">

  <div class="conteudo" id="conteudo">
    <div class="mosaico" id="mosaico"></div>

    <div class="modal" id="modal" aria-hidden="true">
      <img id="modalImg" src="" alt="Imagem ampliada">
    </div>

    <div class="voltar">
      <a href="index.html">BIXO</a>
    </div>
  </div>

<script>
  window.addEventListener('load', ()=>{
    setTimeout(()=>{
      document.getElementById('conteudo').style.display='flex';
    },300);
  });

  const imagens=[];
  for(let i=1;i<=102;i++){ imagens.push(`img${i}.jpg`); }

  const mosaico=document.getElementById('mosaico');
  const modal=document.getElementById('modal');
  const modalImg=document.getElementById('modalImg');

  imagens.forEach(src=>{
    const img=document.createElement('img');
    img.src=src;
    img.alt='Miniatura';
    img.loading='lazy';

    img.addEventListener('click',()=>{
      modalImg.src=src;
      modal.style.display='flex';
      setTimeout(()=> modal.classList.add('show'), 10);
      modal.setAttribute('aria-hidden','false');
    });

    mosaico.appendChild(img);
  });

  function fecharModal(){
    modal.classList.remove('show');
    setTimeout(()=>{
      modal.style.display='none';
      modal.setAttribute('aria-hidden','true');
      modalImg.src='';
    }, 500);
  }

  modal.addEventListener('click', fecharModal);

  document.addEventListener('keydown', e=>{
    if(e.key==='Escape' && modal.style.display==='flex'){
      fecharModal();
    }
  });
</script>

</body>
</html>
