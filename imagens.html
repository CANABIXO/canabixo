<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imagens – BIXO</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin:0;
  /* height:100%;  ❌ removido */
  overflow-x:hidden;
}

body {
  font-family: Arial, sans-serif;
  display:block;
}

/* container */
.conteudo {
  display:block;
}

/* 🔥 MASONRY FUNCIONANDO */
.mosaico {
  column-width: 250px;
  column-gap: 0;
  width:100%;
}

/* 🔥 ESSENCIAL */
.mosaico img {
  width:100%;
  display:block;
  break-inside: avoid;
  margin:0;
}

/* 🔥 BOTÃO ORIGINAL RESTAURADO */
.voltar {
  text-align:center;
  padding:12px 0;
  border-top:1px solid #e5e5e5;
  background:#fff;
}

.voltar {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  text-align: center;
  padding: 12px 0;
  border-top: 1px solid #e5e5e5;
  background: #fff;
  z-index: 999;
}

.voltar a {
  all: unset;
  font-family: Arial, sans-serif;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
  padding: 8px 16px;
  display: inline-block;
  transition: transform 0.2s ease;
}

/* modal */
.modal {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.9);
  justify-content:center;
  align-items:center;
}

.modal img {
  max-width:90%;
  max-height:90%;
}
</style>
</head>

<body>

<div class="conteudo">
  <div class="mosaico" id="mosaico"></div>

  <div class="modal" id="modal">
    <img id="modalImg">
  </div>

  <div class="voltar">
    <a href="index.html">BIXO</a>
  </div>
</div>

<script>
const mosaico = document.getElementById('mosaico');
const modal = document.getElementById('modal');
const modalImg = document.getElementById('modalImg');

const imagens = [];
for(let i=1;i<=102;i++){
  imagens.push(`img${i}.jpg`);
}

imagens.forEach(src=>{
  const img = document.createElement('img');
  img.src = src;

  img.onclick = ()=>{
    modal.style.display='flex';
    modalImg.src = src;
  };

  mosaico.appendChild(img);
});

modal.onclick = ()=> modal.style.display='none';
</script>

</body>
</html>
