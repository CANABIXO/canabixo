<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BIXO — Página Inicial</title>
<link rel="stylesheet" href="style-home.css">
</head>

<body class="home-page">

<!-- CÍRCULO CENTRAL -->
<div id="corePlanet"></div>

<!-- MENU ORBITAL -->
<div class="menuContainer" id="menu">
  <a class="menuItem" href="https://canabixo.com.br/obras">OBRAS</a>
  <a class="menuItem" href="https://canabixo.com.br/imagens">IMAGENS</a>
  <a class="menuItem" href="https://canabixo.com.br/musicas">MÚSICAS</a>
  <a class="menuItem" href="https://canabixo.com.br/videos">VÍDEOS</a>
  <a class="menuItem" href="https://canabixo.com.br/downloads">DOWNLOADS</a>
  <a class="menuItem" href="https://canabixo.com.br/artista">ARTISTA</a>
  <a class="menuItem" href="https://canabixo.com.br/experience">EXPERIENCE</a>
</div>

<script>
const planet = document.getElementById('corePlanet');
const menu = document.getElementById('menu');
const items = document.querySelectorAll('.menuItem');

let menuVisible = false;

/* Movimento 3D suave do círculo com o mouse */
document.addEventListener('mousemove', e => {
    const x = (e.clientX / window.innerWidth - 0.5) * 35;
    const y = (e.clientY / window.innerHeight - 0.5) * -35;
    planet.style.transform = `rotateX(${y}deg) rotateY(${x}deg)`;
});

/* Clique no círculo para mostrar/recolher o menu */
planet.addEventListener('click', () => {
    menuVisible = !menuVisible;

    if (menuVisible) {
        menu.style.display = "block";
        const radius = 180;
        const total = items.length;

        items.forEach((item, index) => {
            const angle = (index / total) * Math.PI * 2;
            const x = Math.cos(angle) * radius;
            const y = Math.sin(angle) * radius;

            item.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px)`;
        });
    } else {
        items.forEach(item => {
            item.style.transform = "translate(-50%, -50%)";
        });
        menu.style.display = "none";
    }
});
</script>

</body>
</html>
