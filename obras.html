<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Obras – BIXO</title>

<style>
body {
  margin: 0;
  background: white;
  font-family: Arial, sans-serif;
  color: black;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  overflow: hidden;
  user-select: none;
}

/* CENTRO */
.container {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
}

/* CÍRCULO PRINCIPAL */
.circle {
  width: 320px;
  height: 320px;
  border-radius: 50%;
  overflow: hidden;
  position: relative;
  cursor: pointer;
  transition: transform 0.3s ease;
}

.circle:hover {
  transform: scale(1.03);
}

.circle img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* DESCRIÇÃO */
.info {
  text-align: center;
  font-size: 13px;
  max-width: 300px;
}

/* BOTÕES LATERAIS */
.nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 32px;
  background: none;
  border: none;
  cursor: pointer;
  user-select: none;
}

#prev {
  left: 40px;
}

#next {
  right: 40px;
}

/* VOLTAR */
.voltar {
  position: absolute;
  bottom: 30px;
  text-align: center;
}

.voltar a {
  all: unset;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0,0,0,0.95);
  justify-content: center;
  align-items: center;
  z-index: 1000;
}

.modal img {
  max-width: 90vw;
  max-height: 90vh;
  object-fit: contain;
}
</style>
</head>

<body>

<button class="nav" id="prev">‹</button>

<div class="container">
  <div class="circle" id="circle">
    <img id="img" src="" alt="">
  </div>

  <div class="info">
    <b id="title"></b><br/>
    <span id="desc"></span>
  </div>
</div>

<button class="nav" id="next">›</button>

<div class="voltar">
  <a href="index.html">BIXO</a>
</div>

<div class="modal" id="modal">
  <img id="modalImg" />
</div>

<script>
const images = [
"obra1.jpg","obra2.jpg","obra3.jpg","obra4.jpg","obra5.jpg","obra6.jpg",
"obra7.jpg","obra8.jpg","obra9.jpg","obra10.jpg","obra11.jpg","obra12.jpg"
];

const titles = [
"Cmente","simbiose","Fungo","Purpurea",
"FUNGIFORME","Biofilia","casa","mitosis",
"fim","Koyaanisqatsi","cinesis","memoria"
];

const descriptions = [
"Sementes","Rocha e colagem","Plástico derretido","Casca de árvore",
"Colagem híbrida","Material reciclado","Renda e concha","Madeira e fotografia",
"Limiar","Distorção de luz","Indução","Arquivo sensorial"
];

let index = 0;

const img = document.getElementById("img");
const title = document.getElementById("title");
const desc = document.getElementById("desc");

function update() {
  img.src = images[index];
  title.textContent = titles[index];
  desc.textContent = descriptions[index];
}

function next() {
  index = (index + 1) % images.length;
  update();
}

function prev() {
  index = (index - 1 + images.length) % images.length;
  update();
}

document.getElementById("next").onclick = next;
document.getElementById("prev").onclick = prev;

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") next();
  if (e.key === "ArrowLeft") prev();
});

document.getElementById("circle").onclick = () => {
  document.getElementById("modal").style.display = "flex";
  document.getElementById("modalImg").src = images[index];
};

document.getElementById("modal").onclick = () => {
  document.getElementById("modal").style.display = "none";
};

update();
</script>

</body>
</html>
